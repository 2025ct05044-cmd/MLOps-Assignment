
name: Heart Disease ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint source and tests
        run: ruff check src tests

      - name: Run unit tests
        run: python -m pytest tests -v

      - name: Train model when dataset is available
        run: |
          if [ -f data/processed/cleaned_heart_disease.csv ]; then
            python -m src.train --data data/processed/cleaned_heart_disease.csv
          else
            echo "Processed dataset not found; training skipped."
          fi
